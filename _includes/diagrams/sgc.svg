<figure class="diagram"><svg class="dg" viewBox="0 0 640 236" role="img" aria-labelledby="sgc-t sgc-d" xmlns="http://www.w3.org/2000/svg"><title id="sgc-t">SmartNIC–GPU–CPU co-design</title><desc id="sgc-d">Inside a training node, a SmartNIC prefetches and buffers parameters from the network and host memory and schedules them to the GPU, overlapping communication with computation.</desc><style>.dg text{font-family:Roboto,Helvetica,Arial,sans-serif}
.dg .bx{fill:var(--dg-box,#ffffff);stroke:var(--dg-line,#c9c8c2);stroke-width:1.2}
.dg .hl{fill:var(--dg-hl,#e3eefb);stroke:var(--dg-hl-line,#2a78d6);stroke-width:1.4}
.dg .op{fill:var(--dg-op,#fdeae1);stroke:var(--dg-op-line,#eb6834);stroke-width:1.4}
.dg .grp{fill:var(--dg-grp,#f4f4f1);stroke:var(--dg-line,#c9c8c2);stroke-width:1.2;stroke-dasharray:5 4}
.dg .tx{fill:var(--dg-text,#1f2328)}
.dg .sb{fill:var(--dg-muted,#6b6a65)}
.dg .gl{fill:var(--dg-muted,#6b6a65);font-weight:500}
.dg .ar{stroke:var(--dg-arrow,#8f8e89);fill:none;stroke-width:1.6}
.dg .ar.h{stroke:var(--dg-hl-line,#2a78d6)}
.dg .ar.o{stroke:var(--dg-op-line,#eb6834)}
.dg .arh{fill:var(--dg-arrow,#8f8e89)}
.dg .arh.h{fill:var(--dg-hl-line,#2a78d6)}
.dg .arh.o{fill:var(--dg-op-line,#eb6834)}</style><defs><marker id="sgc-mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sgc-mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sgc-mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh o" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="grp" x="20" y="14" width="452" height="206" rx="10"/>
<text class="gl" x="32" y="32" font-size="12">Training node</text>
<rect class="bx" x="42" y="46" width="156" height="52" rx="7"/>
<text class="tx" x="120.0" y="70.0" text-anchor="middle" font-size="13" font-weight="500">GPU</text>
<text class="sb" x="120.0" y="85.0" text-anchor="middle" font-size="11">forward / backward</text>
<rect class="bx" x="42" y="150" width="156" height="52" rx="7"/>
<text class="tx" x="120.0" y="174.0" text-anchor="middle" font-size="13" font-weight="500">CPU + host memory</text>
<text class="sb" x="120.0" y="189.0" text-anchor="middle" font-size="11">offloaded state</text>
<rect class="hl" x="270" y="92" width="182" height="66" rx="7"/>
<text class="tx" x="361.0" y="123.0" text-anchor="middle" font-size="13" font-weight="500">SmartNIC</text>
<text class="sb" x="361.0" y="138.0" text-anchor="middle" font-size="11">prefetch · buffer · schedule</text>
<rect class="bx" x="510" y="92" width="112" height="66" rx="7"/>
<text class="tx" x="566.0" y="123.0" text-anchor="middle" font-size="13" font-weight="500">Network</text>
<text class="sb" x="566.0" y="138.0" text-anchor="middle" font-size="11">other nodes</text>
<polyline class="ar h" points="270,110 200,76" marker-end="url(#sgc-mh)"/>
<text class="sb" x="252" y="80" text-anchor="start" font-size="11">parameters</text>
<polyline class="ar" points="200,172 268,140" marker-end="url(#sgc-mn)" marker-start="url(#sgc-mn)"/>
<text class="sb" x="238" y="172" text-anchor="middle" font-size="11">state</text>
<polyline class="ar" points="452,125 508,125" marker-end="url(#sgc-mn)" marker-start="url(#sgc-mn)"/></svg>
</figure>
