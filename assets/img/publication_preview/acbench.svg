<svg class="dg" viewBox="0 0 640 220" role="img" aria-labelledby="acbench-t acbench-d" xmlns="http://www.w3.org/2000/svg"><title id="acbench-t">ACBench</title><desc id="acbench-d">A task from a real merged pull request goes to an LLM agent, whose patch is applied, tested and benchmarked against the human patch. A feedback policy decides whether to retry and what information to send back.</desc><style>.dg text{font-family:Roboto,Helvetica,Arial,sans-serif}
.dg .bx{fill:var(--dg-box,#ffffff);stroke:var(--dg-line,#c9c8c2);stroke-width:1.2}
.dg .hl{fill:var(--dg-hl,#e3eefb);stroke:var(--dg-hl-line,#2a78d6);stroke-width:1.4}
.dg .op{fill:var(--dg-op,#fdeae1);stroke:var(--dg-op-line,#eb6834);stroke-width:1.4}
.dg .grp{fill:var(--dg-grp,#f4f4f1);stroke:var(--dg-line,#c9c8c2);stroke-width:1.2;stroke-dasharray:5 4}
.dg .tx{fill:var(--dg-text,#1f2328)}
.dg .sb{fill:var(--dg-muted,#6b6a65)}
.dg .gl{fill:var(--dg-muted,#6b6a65);font-weight:500}
.dg .ar{stroke:var(--dg-arrow,#8f8e89);fill:none;stroke-width:1.6}
.dg .ar.h{stroke:var(--dg-hl-line,#2a78d6)}
.dg .ar.o{stroke:var(--dg-op-line,#eb6834)}
.dg .arh{fill:var(--dg-arrow,#8f8e89)}
.dg .arh.h{fill:var(--dg-hl-line,#2a78d6)}
.dg .arh.o{fill:var(--dg-op-line,#eb6834)}</style><defs><marker id="acbench-mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M0,0 L10,5 L0,10 z"/></marker><marker id="acbench-mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="acbench-mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh o" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="640" height="220" fill="#ffffff"/><rect class="bx" x="18" y="30" width="120" height="52" rx="7"/>
<text class="tx" x="78.0" y="54.0" text-anchor="middle" font-size="13" font-weight="500">Real PR task</text>
<text class="sb" x="78.0" y="69.0" text-anchor="middle" font-size="11">production Go code</text>
<rect class="hl" x="166" y="30" width="120" height="52" rx="7"/>
<text class="tx" x="226.0" y="54.0" text-anchor="middle" font-size="13" font-weight="500">LLM agent</text>
<text class="sb" x="226.0" y="69.0" text-anchor="middle" font-size="11">proposes patch</text>
<rect class="bx" x="314" y="30" width="130" height="52" rx="7"/>
<text class="tx" x="379.0" y="54.0" text-anchor="middle" font-size="13" font-weight="500">Apply + test</text>
<text class="sb" x="379.0" y="69.0" text-anchor="middle" font-size="11">benchmark</text>
<rect class="bx" x="472" y="30" width="150" height="52" rx="7"/>
<text class="tx" x="547.0" y="54.0" text-anchor="middle" font-size="13" font-weight="500">Score</text>
<text class="sb" x="547.0" y="69.0" text-anchor="middle" font-size="11">vs. human patch</text>
<polyline class="ar" points="138,56 164,56" marker-end="url(#acbench-mn)"/>
<polyline class="ar" points="286,56 312,56" marker-end="url(#acbench-mn)"/>
<polyline class="ar" points="444,56 470,56" marker-end="url(#acbench-mn)"/>
<rect class="op" x="220" y="140" width="200" height="50" rx="7"/>
<text class="tx" x="320.0" y="163.0" text-anchor="middle" font-size="13" font-weight="500">Feedback policy</text>
<text class="sb" x="320.0" y="178.0" text-anchor="middle" font-size="11">retry · error message · profile</text>
<polyline class="ar o" points="379,82 379,138" marker-end="url(#acbench-mo)"/>
<text class="sb" x="386" y="114" text-anchor="start" font-size="11">result</text>
<polyline class="ar o" points="252,140 252,84" marker-end="url(#acbench-mo)"/>
<text class="sb" x="245" y="114" text-anchor="end" font-size="11">retry with feedback</text>
<text class="sb" x="320" y="208" text-anchor="middle" font-size="11">What helps: the extra attempt, or the information?</text></svg>
