.dg .op{fill:var(--dg-op,#fdeae1);stroke:var(--dg-op-line,#eb6834);stroke-width:1.4}
.dg .grp{fill:var(--dg-grp,#f4f4f1);stroke:var(--dg-line,#c9c8c2);stroke-width:1.2;stroke-dasharray:5 4}
.dg .tx{fill:var(--dg-text,#1f2328)}
.dg .sb{fill:var(--dg-muted,#6b6a65)}
.dg .gl{fill:var(--dg-muted,#6b6a65);font-weight:500}
.dg .ar{stroke:var(--dg-arrow,#8f8e89);fill:none;stroke-width:1.6}
.dg .ar.h{stroke:var(--dg-hl-line,#2a78d6)}
.dg .ar.o{stroke:var(--dg-op-line,#eb6834)}
.dg .arh{fill:var(--dg-arrow,#8f8e89)}
.dg .arh.h{fill:var(--dg-hl-line,#2a78d6)}
.dg .arh.o{fill:var(--dg-op-line,#eb6834)}</style><defs><marker id="poolstatelens-mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M0,0 L10,5 L0,10 z"/></marker><marker id="poolstatelens-mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="poolstatelens-mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh o" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="640" height="262" fill="#ffffff"/><rect class="bx" x="40" y="16" width="125" height="46" rx="7"/>
