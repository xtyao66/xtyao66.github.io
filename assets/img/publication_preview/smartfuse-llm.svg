<svg class="dg" viewBox="0 0 640 236" role="img" aria-labelledby="smartfuse-llm-t smartfuse-llm-d" xmlns="http://www.w3.org/2000/svg"><title id="smartfuse-llm-t">SmartFuse-LLM</title><desc id="smartfuse-llm-d">Four GPUs send partial results to a programmable switch, which reduces them, applies the residual add and RMSNorm, and broadcasts the normalized result back: one network round trip per boundary instead of two.</desc><style>.dg text{font-family:Roboto,Helvetica,Arial,sans-serif}
.dg .bx{fill:var(--dg-box,#ffffff);stroke:var(--dg-line,#c9c8c2);stroke-width:1.2}
.dg .hl{fill:var(--dg-hl,#e3eefb);stroke:var(--dg-hl-line,#2a78d6);stroke-width:1.4}
.dg .op{fill:var(--dg-op,#fdeae1);stroke:var(--dg-op-line,#eb6834);stroke-width:1.4}
.dg .grp{fill:var(--dg-grp,#f4f4f1);stroke:var(--dg-line,#c9c8c2);stroke-width:1.2;stroke-dasharray:5 4}
.dg .tx{fill:var(--dg-text,#1f2328)}
.dg .sb{fill:var(--dg-muted,#6b6a65)}
.dg .gl{fill:var(--dg-muted,#6b6a65);font-weight:500}
.dg .ar{stroke:var(--dg-arrow,#8f8e89);fill:none;stroke-width:1.6}
.dg .ar.h{stroke:var(--dg-hl-line,#2a78d6)}
.dg .ar.o{stroke:var(--dg-op-line,#eb6834)}
.dg .arh{fill:var(--dg-arrow,#8f8e89)}
.dg .arh.h{fill:var(--dg-hl-line,#2a78d6)}
.dg .arh.o{fill:var(--dg-op-line,#eb6834)}</style><defs><marker id="smartfuse-llm-mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M0,0 L10,5 L0,10 z"/></marker><marker id="smartfuse-llm-mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="smartfuse-llm-mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh o" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="640" height="236" fill="#ffffff"/><rect class="bx" x="40" y="18" width="120" height="40" rx="7"/>
<text class="tx" x="100.0" y="42.5" text-anchor="middle" font-size="13" font-weight="500">GPU 0</text>
<polyline class="ar" points="82,58 82,96" marker-end="url(#smartfuse-llm-mn)"/>
<polyline class="ar h" points="118,96 118,58" marker-end="url(#smartfuse-llm-mh)"/>
<rect class="bx" x="190" y="18" width="120" height="40" rx="7"/>
<text class="tx" x="250.0" y="42.5" text-anchor="middle" font-size="13" font-weight="500">GPU 1</text>
<polyline class="ar" points="232,58 232,96" marker-end="url(#smartfuse-llm-mn)"/>
<polyline class="ar h" points="268,96 268,58" marker-end="url(#smartfuse-llm-mh)"/>
<rect class="bx" x="340" y="18" width="120" height="40" rx="7"/>
<text class="tx" x="400.0" y="42.5" text-anchor="middle" font-size="13" font-weight="500">GPU 2</text>
<polyline class="ar" points="382,58 382,96" marker-end="url(#smartfuse-llm-mn)"/>
<polyline class="ar h" points="418,96 418,58" marker-end="url(#smartfuse-llm-mh)"/>
<rect class="bx" x="490" y="18" width="120" height="40" rx="7"/>
<text class="tx" x="550.0" y="42.5" text-anchor="middle" font-size="13" font-weight="500">GPU 3</text>
<polyline class="ar" points="532,58 532,96" marker-end="url(#smartfuse-llm-mn)"/>
<polyline class="ar h" points="568,96 568,58" marker-end="url(#smartfuse-llm-mh)"/>
<rect class="grp" x="30" y="98" width="580" height="96" rx="10"/>
<text class="gl" x="42" y="116" font-size="12">Programmable switch (FPGA datapath)</text>
<rect class="hl" x="48" y="130" width="116" height="46" rx="7"/>
<text class="tx" x="106.0" y="157.5" text-anchor="middle" font-size="13" font-weight="500">Reduce</text>
<rect class="op" x="188" y="130" width="100" height="46" rx="7"/>
<text class="tx" x="238.0" y="151.0" text-anchor="middle" font-size="13" font-weight="500">Add</text>
<text class="sb" x="238.0" y="166.0" text-anchor="middle" font-size="11">residual</text>
<rect class="op" x="312" y="130" width="120" height="46" rx="7"/>
<text class="tx" x="372.0" y="157.5" text-anchor="middle" font-size="13" font-weight="500">RMSNorm</text>
<rect class="hl" x="456" y="130" width="136" height="46" rx="7"/>
<text class="tx" x="524.0" y="157.5" text-anchor="middle" font-size="13" font-weight="500">Broadcast</text>
<polyline class="ar" points="164,153 186,153" marker-end="url(#smartfuse-llm-mn)"/>
<polyline class="ar" points="288,153 310,153" marker-end="url(#smartfuse-llm-mn)"/>
<polyline class="ar" points="432,153 454,153" marker-end="url(#smartfuse-llm-mn)"/>
<text class="sb" x="320" y="220" text-anchor="middle" font-size="11">Partial results go in, normalized activations come out: one round trip instead of two</text></svg>
