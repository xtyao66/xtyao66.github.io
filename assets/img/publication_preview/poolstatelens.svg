<svg class="dg" viewBox="0 0 640 262" role="img" aria-labelledby="poolstatelens-t poolstatelens-d" xmlns="http://www.w3.org/2000/svg"><title id="poolstatelens-t">PoolStateLens</title><desc id="poolstatelens-d">GPUs keep only their active layer. An NVLink switch multicasts parameters from a switch-attached memory pool and reduces gradients back into it, where an optimizer updates parameters and optimizer state.</desc><style>.dg text{font-family:Roboto,Helvetica,Arial,sans-serif}
.dg .bx{fill:var(--dg-box,#ffffff);stroke:var(--dg-line,#c9c8c2);stroke-width:1.2}
