<figure class="diagram"><svg class="dg" viewBox="0 0 640 210" role="img" aria-labelledby="rl-gpu-compiler-t rl-gpu-compiler-d" xmlns="http://www.w3.org/2000/svg"><title id="rl-gpu-compiler-t">RL-guided GPU compiler optimization</title><desc id="rl-gpu-compiler-d">An RL-guided search proposes changes to a Triton kernel&#x27;s compilation, from compiler passes to the final machine code; each change is traced through the compiler stages and timed on an NVIDIA GB200.</desc><style>.dg text{font-family:Roboto,Helvetica,Arial,sans-serif}
.dg .bx{fill:var(--dg-box,#ffffff);stroke:var(--dg-line,#c9c8c2);stroke-width:1.2}
.dg .hl{fill:var(--dg-hl,#e3eefb);stroke:var(--dg-hl-line,#2a78d6);stroke-width:1.4}
.dg .op{fill:var(--dg-op,#fdeae1);stroke:var(--dg-op-line,#eb6834);stroke-width:1.4}
.dg .grp{fill:var(--dg-grp,#f4f4f1);stroke:var(--dg-line,#c9c8c2);stroke-width:1.2;stroke-dasharray:5 4}
.dg .tx{fill:var(--dg-text,#1f2328)}
.dg .sb{fill:var(--dg-muted,#6b6a65)}
.dg .gl{fill:var(--dg-muted,#6b6a65);font-weight:500}
.dg .ar{stroke:var(--dg-arrow,#8f8e89);fill:none;stroke-width:1.6}
.dg .ar.h{stroke:var(--dg-hl-line,#2a78d6)}
.dg .ar.o{stroke:var(--dg-op-line,#eb6834)}
.dg .arh{fill:var(--dg-arrow,#8f8e89)}
.dg .arh.h{fill:var(--dg-hl-line,#2a78d6)}
.dg .arh.o{fill:var(--dg-op-line,#eb6834)}</style><defs><marker id="rl-gpu-compiler-mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rl-gpu-compiler-mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rl-gpu-compiler-mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh o" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bx" x="18" y="34" width="86" height="44" rx="7"/>
<text class="tx" x="61.0" y="60.5" text-anchor="middle" font-size="13" font-weight="500">Triton</text>
<rect class="bx" x="121" y="34" width="86" height="44" rx="7"/>
<text class="tx" x="164.0" y="60.5" text-anchor="middle" font-size="13" font-weight="500">TTGIR</text>
<polyline class="ar" points="104,56 119,56" marker-end="url(#rl-gpu-compiler-mn)"/>
<rect class="bx" x="224" y="34" width="86" height="44" rx="7"/>
<text class="tx" x="267.0" y="60.5" text-anchor="middle" font-size="13" font-weight="500">LLVM IR</text>
<polyline class="ar" points="207,56 222,56" marker-end="url(#rl-gpu-compiler-mn)"/>
<rect class="bx" x="327" y="34" width="86" height="44" rx="7"/>
<text class="tx" x="370.0" y="60.5" text-anchor="middle" font-size="13" font-weight="500">PTX</text>
<polyline class="ar" points="310,56 325,56" marker-end="url(#rl-gpu-compiler-mn)"/>
<rect class="bx" x="430" y="34" width="86" height="44" rx="7"/>
<text class="tx" x="473.0" y="60.5" text-anchor="middle" font-size="13" font-weight="500">SASS</text>
<polyline class="ar" points="413,56 428,56" marker-end="url(#rl-gpu-compiler-mn)"/>
<rect class="hl" x="533" y="34" width="86" height="44" rx="7"/>
<text class="tx" x="576.0" y="60.5" text-anchor="middle" font-size="13" font-weight="500">GB200</text>
<polyline class="ar" points="516,56 531,56" marker-end="url(#rl-gpu-compiler-mn)"/>
<text class="sb" x="268" y="20" text-anchor="middle" font-size="11">Trace each change through the compiler</text>
<rect class="op" x="220" y="142" width="200" height="50" rx="7"/>
<text class="tx" x="320.0" y="165.0" text-anchor="middle" font-size="13" font-weight="500">RL-guided search</text>
<text class="sb" x="320.0" y="180.0" text-anchor="middle" font-size="11">proposes changes</text>
