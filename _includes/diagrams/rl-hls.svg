<figure class="diagram"><svg class="dg" viewBox="0 0 640 206" role="img" aria-labelledby="rl-hls-t rl-hls-d" xmlns="http://www.w3.org/2000/svg"><title id="rl-hls-t">RL pass ordering for high-level synthesis</title><desc id="rl-hls-d">An RL agent chooses the LLVM pass sequence applied to a C/C++ kernel before high-level synthesis, and learns from the resulting FPGA design&#x27;s quality.</desc><style>.dg text{font-family:Roboto,Helvetica,Arial,sans-serif}
.dg .bx{fill:var(--dg-box,#ffffff);stroke:var(--dg-line,#c9c8c2);stroke-width:1.2}
.dg .hl{fill:var(--dg-hl,#e3eefb);stroke:var(--dg-hl-line,#2a78d6);stroke-width:1.4}
.dg .op{fill:var(--dg-op,#fdeae1);stroke:var(--dg-op-line,#eb6834);stroke-width:1.4}
.dg .grp{fill:var(--dg-grp,#f4f4f1);stroke:var(--dg-line,#c9c8c2);stroke-width:1.2;stroke-dasharray:5 4}
.dg .tx{fill:var(--dg-text,#1f2328)}
.dg .sb{fill:var(--dg-muted,#6b6a65)}
.dg .gl{fill:var(--dg-muted,#6b6a65);font-weight:500}
.dg .ar{stroke:var(--dg-arrow,#8f8e89);fill:none;stroke-width:1.6}
.dg .ar.h{stroke:var(--dg-hl-line,#2a78d6)}
.dg .ar.o{stroke:var(--dg-op-line,#eb6834)}
.dg .arh{fill:var(--dg-arrow,#8f8e89)}
.dg .arh.h{fill:var(--dg-hl-line,#2a78d6)}
.dg .arh.o{fill:var(--dg-op-line,#eb6834)}</style><defs><marker id="rl-hls-mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rl-hls-mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rl-hls-mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh o" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bx" x="18" y="26" width="120" height="50" rx="7"/>
<text class="tx" x="78.0" y="55.5" text-anchor="middle" font-size="13" font-weight="500">C/C++ kernel</text>
<rect class="op" x="166" y="26" width="140" height="50" rx="7"/>
<text class="tx" x="236.0" y="49.0" text-anchor="middle" font-size="13" font-weight="500">LLVM passes</text>
<text class="sb" x="236.0" y="64.0" text-anchor="middle" font-size="11">order chosen by agent</text>
<rect class="bx" x="334" y="26" width="120" height="50" rx="7"/>
<text class="tx" x="394.0" y="55.5" text-anchor="middle" font-size="13" font-weight="500">HLS tool</text>
<rect class="bx" x="482" y="26" width="140" height="50" rx="7"/>
<text class="tx" x="552.0" y="49.0" text-anchor="middle" font-size="13" font-weight="500">FPGA design</text>
<text class="sb" x="552.0" y="64.0" text-anchor="middle" font-size="11">latency · area</text>
<polyline class="ar" points="138,51 164,51" marker-end="url(#rl-hls-mn)"/>
<polyline class="ar" points="306,51 332,51" marker-end="url(#rl-hls-mn)"/>
<polyline class="ar" points="454,51 480,51" marker-end="url(#rl-hls-mn)"/>
<rect class="hl" x="220" y="140" width="200" height="50" rx="7"/>
<text class="tx" x="320.0" y="163.0" text-anchor="middle" font-size="13" font-weight="500">RL agent</text>
<text class="sb" x="320.0" y="178.0" text-anchor="middle" font-size="11">learns pass order</text>
<polyline class="ar h" points="260,140 236,78" marker-end="url(#rl-hls-mh)"/>
<text class="sb" x="242" y="116" text-anchor="end" font-size="11">pass sequence</text>
<polyline class="ar h" points="552,76 552,165 422,165" marker-end="url(#rl-hls-mh)"/>
<text class="sb" x="558" y="124" text-anchor="start" font-size="11">reward</text></svg>
</figure>
