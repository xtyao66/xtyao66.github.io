<figure class="diagram"><svg class="dg" viewBox="0 0 640 212" role="img" aria-labelledby="kernelsight-lm-t kernelsight-lm-d" xmlns="http://www.w3.org/2000/svg"><title id="kernelsight-lm-t">KernelSight-LM</title><desc id="kernelsight-lm-d">Kernel-latency, communication and host-overhead models feed a discrete-event scheduler that predicts end-to-end LLM inference latency and throughput.</desc><style>.dg text{font-family:Roboto,Helvetica,Arial,sans-serif}
